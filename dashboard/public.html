<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Parking · Posti liberi</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center;
           background: #1b252e; color: #fff; text-align: center; }
    .n { font-size: 8rem; font-weight: 700; margin: 0; }
  </style>
</head>
<body>
  <!-- Segnaposto della vista pubblica ("tabellone"): usa solo GET /api/public (doc/interfacce.md, §5.2). -->
  <div>
    <p class="n" id="free">–</p>
    <p id="label">posti liberi</p>
  </div>
  <script>
    async function refresh() {
      try {
        const p = await (await fetch("/api/public")).json();
        document.getElementById("free").textContent = p.alarm ? "!" : p.free;
        document.getElementById("label").textContent =
          p.alarm ? "EVACUARE" : (p.parking === "FULL" ? "PARCHEGGIO PIENO" : "posti liberi");
      } catch (e) {
        document.getElementById("label").textContent = "non disponibile";
      }
    }
    refresh();
    setInterval(refresh, 2000);
  </script>
</body>
</html>
